<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · PracticalPodcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div style="position:fixed;top:16px;right:16px;z-index:100">
    <button class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode" title="Switch to light mode">
      <svg data-icon-sun viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg data-icon-moon viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <main id="main" class="auth">
    <div class="auth__card">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        PracticalPodcast
      </div>

      <h1 class="auth__title">Welcome back</h1>
      <p class="auth__sub">Sign in with your email. We'll send a 6-digit verification code to confirm it's you — no password needed.</p>

      <form action="verify.html" method="get">
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          <p class="field__hint">We'll email a one-time code that expires in 10 minutes.</p>
        </div>
        <button class="btn btn--primary btn--block btn--lg" type="submit">
          Send verification code
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <p class="auth__foot">New here? Just enter your email — we'll create your account automatically.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
