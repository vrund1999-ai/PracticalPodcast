<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose your topics · PracticalPodcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div style="position:fixed;top:16px;right:16px;z-index:100">
    <button class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode" title="Switch to light mode">
      <svg data-icon-sun viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg data-icon-moon viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <main id="main" class="auth">
    <div class="auth__card" style="max-width:640px">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        PracticalPodcast
      </div>

      <h1 class="auth__title">What should we cover?</h1>
      <p class="auth__sub">Pick the topics you care about. We'll prioritize them in your daily podcasts. You've selected <strong data-chip-count>4</strong> — choose at least 3. You can change these anytime.</p>

      <div class="chips" data-chip-group style="justify-content:center;margin-bottom:28px">
        <button type="button" class="chip" aria-pressed="true"><span class="chip__emoji" aria-hidden="true">💰</span> Finance</button>
        <button type="button" class="chip" aria-pressed="true"><span class="chip__emoji" aria-hidden="true">💻</span> Technology</button>
        <button type="button" class="chip" aria-pressed="true"><span class="chip__emoji" aria-hidden="true">🔬</span> Science</button>
        <button type="button" class="chip" aria-pressed="true"><span class="chip__emoji" aria-hidden="true">🤖</span> AI</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🏛️</span> Politics</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🌍</span> Geopolitics</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🚆</span> Transportation</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">📈</span> Markets</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🩺</span> Health</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🌱</span> Climate</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">⚡</span> Energy</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🏗️</span> Business</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🛡️</span> Defense</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🎬</span> Culture</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">⚽</span> Sports</button>
        <button type="button" class="chip" aria-pressed="false"><span class="chip__emoji" aria-hidden="true">🚀</span> Space</button>
      </div>

      <a class="btn btn--primary btn--block btn--lg" href="library.html">
        Continue to my podcasts
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="auth__foot"><a href="library.html">Skip for now</a> — we'll cover the day's top stories across all topics.</p>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="api.js"></script>
  <script src="pages/onboarding.js"></script>
</body>
</html>
